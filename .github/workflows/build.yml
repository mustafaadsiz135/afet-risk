name: APK derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK derle
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/release/app-release.apk AfetRiskRehberi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AfetRiskRehberi-apk
          path: AfetRiskRehberi.apk

      - name: "Releases sayfasına yükle (son sürüm)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AfetRiskRehberi.apk \
            --title "Afet Risk Rehberi — son sürüm" \
            --notes "Otomatik derlenen APK (commit ${GITHUB_SHA::7}). Telefona indirip kurabilirsiniz." \
            --target "$GITHUB_SHA"
