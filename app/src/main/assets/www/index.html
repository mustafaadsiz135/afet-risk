<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afet Risk Rehberi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <button id="btnBack" class="icon-btn" hidden aria-label="Geri">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
  </button>
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3l11 5v7c0 7-4.6 12.2-11 14-6.4-1.8-11-7-11-14V8z"/><path class="pulse" d="M8 17h4l2-5 3 9 2-6 1 2h4"/></svg>
    <span data-t="appName">Afet Risk Rehberi</span>
  </div>
  <button id="btnLang" class="pill-btn">EN</button>
  <button id="btnAbout" class="icon-btn" aria-label="info">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
  </button>
</header>

<main>
  <!-- 1. Konum seçimi -->
  <section id="vHome" class="view">
    <p class="tagline" data-t="tagline"></p>
    <div class="card form">
      <h2 data-t="where"></h2>
      <label><span data-t="country"></span><select id="selCountry"></select></label>
      <label><span data-t="state"></span><select id="selState" disabled></select></label>
      <label><span data-t="city"></span><select id="selCity" disabled></select></label>
      <label><span data-t="placeLabel"></span>
        <input id="inpPlace" type="search" autocomplete="off" data-tp="placeHint"></label>
      <div class="row">
        <button id="btnFind" class="btn primary" data-t="find"></button>
        <button id="btnCenter" class="btn ghost" data-t="evalCenter"></button>
      </div>
      <p id="formMsg" class="msg" hidden></p>
    </div>
    <div id="results" class="card" hidden>
      <h3 data-t="results"></h3>
      <ul id="resultList" class="results"></ul>
    </div>
    <div class="hz-strip" aria-hidden="true">
      <div><i class="hz-ic eq"></i><span data-t="hz.eq"></span></div>
      <div><i class="hz-ic fl"></i><span data-t="hz.fl"></span></div>
      <div><i class="hz-ic ls"></i><span data-t="hz.ls"></span></div>
      <div><i class="hz-ic av"></i><span data-t="hz.av"></span></div>
      <div><i class="hz-ic cr"></i><span data-t="hz.cr"></span></div>
    </div>
  </section>

  <!-- 2. İlerleme -->
  <section id="vProgress" class="view" hidden>
    <div class="card center">
      <div class="spinner"></div>
      <h2><span data-t="analyzing"></span>…</h2>
      <p id="progPlace" class="muted"></p>
      <ul id="stepList" class="steps"></ul>
    </div>
  </section>

  <!-- 3. Rapor -->
  <section id="vReport" class="view" hidden></section>
</main>

<div id="about" class="sheet" hidden>
  <div class="sheet-body card">
    <h2 data-t="about"></h2>
    <p data-t="aboutText"></p>
    <h3 data-t="method"></h3>
    <p data-t="methodText"></p>
    <h3 data-t="sources"></h3>
    <ul id="aboutSources" class="small"></ul>
    <p class="small muted" data-t="disclaimer"></p>
    <p class="small muted"><span data-t="version"></span> 1.0</p>
    <button id="btnCloseAbout" class="btn primary" data-t="close"></button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
